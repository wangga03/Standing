<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Export Standings | FFL</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Switch to html-to-image which handles modern CSS and flexbox much better than html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;400;700&family=Hanken+Grotesk:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#60a5fa",
                        "on-surface": "#e5e2e1",
                        "surface-variant": "#1e293b",
                        "background": "#020617",
                        "surface-bright": "#1e293b",
                        "on-surface-variant": "#bfdbfe",
                        "surface": "#020617",
                        "surface-container": "#0f172a"
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-background text-on-surface font-sans flex flex-col min-h-screen">

    <!-- Top Action Bar -->
    <header class="bg-surface-container border-b border-primary/20 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-primary flex items-center gap-2">
                <span class="material-symbols-outlined">image</span>
                Design Preview
            </h1>
            <div class="flex gap-4">
                <button onclick="window.close()"
                    class="text-on-surface-variant hover:text-primary transition-colors px-4 py-2 font-medium">Close</button>

                <button id="download-btn"
                    class="bg-primary text-black font-bold px-6 py-2 rounded shadow-lg hover:bg-primary/90 transition-transform active:scale-95 flex items-center gap-2">
                    <span class="material-symbols-outlined">download</span>
                    Download PNG
                </button>
            </div>
        </div>
    </header>

    <!-- Preview Canvas Area -->
    <main class="flex-1 overflow-auto flex items-center justify-center p-8 bg-black/50">
        <!-- Scale down container for preview -->
        <!-- Scale down container for preview -->
        <div id="pages-container" class="shadow-2xl ring-4 ring-primary/30 relative flex flex-col gap-16"
            style="transform: scale(0.5); transform-origin: top center; margin-bottom: -720px;">
            <!-- Pages will be dynamically injected here -->
        </div>

        <template id="page-template">
            <div class="capture-area w-[1080px] h-[1440px] bg-[#5e0000] p-12 relative flex flex-col overflow-hidden"
                style="background-image: url('bg.png'); background-size: cover; background-position: center; font-family: 'Space Grotesk', sans-serif;">
                <!-- Vignette effect -->
                <div class="absolute inset-0 z-0 shadow-[inset_0_0_150px_rgba(0,0,0,0.8)] pointer-events-none"></div>

                <div class="flex-1 z-10 flex flex-col" style="padding-top: 380px;">
                    <!-- Page content will be injected here -->
                </div>
            </div>
        </template>

        <template id="group-template">
            <div class="group-container mb-12">
                <!-- Group Title -->
                <h2
                    class="group-title text-center text-4xl font-headline-display text-white tracking-widest drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] mb-6 uppercase">
                </h2>

                <!-- Table -->
                <div class="flex flex-col gap-2 w-full px-8 relative transition-all duration-300"
                    style="font-family: 'Space Grotesk', sans-serif;">
                    <!-- Header -->
                    <div class="table-header flex font-bold mb-2 h-12">
                        <div class="w-[60px] bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-2xl flex items-center justify-center rounded-lg shadow-lg border-2 border-[#071945] border-b-[5px]"
                            style="text-shadow: 2px 2px 4px black;">POS</div>
                        <div class="w-[432px] ml-2 bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-3xl flex items-center justify-center rounded-lg shadow-lg border-2 border-[#071945] border-b-[5px] uppercase tracking-wider"
                            style="text-shadow: 2px 2px 4px black;">TEAM</div>
                        <div class="w-[60px] ml-2 bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-2xl flex items-center justify-center rounded-lg shadow-lg border-2 border-[#071945] border-b-[5px]"
                            style="text-shadow: 2px 2px 4px black;">P</div>
                        <div class="w-[60px] ml-2 bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-2xl flex items-center justify-center rounded-lg shadow-lg border-2 border-[#071945] border-b-[5px]"
                            style="text-shadow: 2px 2px 4px black;">W</div>
                        <div class="w-[60px] ml-2 bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-2xl flex items-center justify-center rounded-lg shadow-lg border-2 border-[#071945] border-b-[5px]"
                            style="text-shadow: 2px 2px 4px black;">D</div>
                        <div class="w-[60px] ml-2 bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-2xl flex items-center justify-center rounded-lg shadow-lg border-2 border-[#071945] border-b-[5px]"
                            style="text-shadow: 2px 2px 4px black;">L</div>
                        <div class="w-[68px] ml-2 bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-2xl flex items-center justify-center rounded-lg shadow-lg border-2 border-[#071945] border-b-[5px]"
                            style="text-shadow: 2px 2px 4px black;">GF</div>
                        <div class="w-[68px] ml-2 bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-2xl flex items-center justify-center rounded-lg shadow-md border-2 border-[#071945] border-b-[5px]"
                            style="text-shadow: 2px 2px 4px black;">GA</div>
                        <div class="w-[84px] ml-2 bg-gradient-to-b from-[#1643a3] to-[#0c2866] text-white text-2xl flex items-center justify-center rounded-lg shadow-lg border-2 border-[#071945] border-b-[5px]"
                            style="text-shadow: 2px 2px 4px black;">PTS</div>
                    </div>
                    <!-- Rows Dynamic Container -->
                    <div class="table-rows flex flex-col gap-2 w-full">
                        <!-- Content loaded by JS -->
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- Overlay Loader -->
    <div id="loader"
        class="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-[100] transition-opacity duration-300">
        <span class="material-symbols-outlined text-primary text-6xl animate-spin mb-4">refresh</span>
        <p class="text-xl font-medium tracking-wide">Rendering preview...</p>
    </div>

    <script src="export.js"></script>
</body>

</html>
